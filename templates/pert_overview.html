<tal:block metal:use-macro="container/standard_master/macros/master">

<div metal:fill-slot="available_garments">
  <tal:dummy replace="structure container/available_garments"/>
</div>

<div metal:fill-slot="available_actions">
  <tal:dummy replace="structure container/available_actions"/>
</div>

<div metal:fill-slot="main">
<h1 tal:content="python:get_frame_pretty_name(here) or get_frame_name(here)"></h1>

<p><em tal:content="python:get_slot_value(here,':DOCUMENTATION')[0] or ''"></em></p>

<object type="image/svg+xml" style="max-width:100%"
        tal:attributes="data python:request.object_request()+'__aon.dot.svg'">
<img alt="PERT chart" style="max-width:750px;height:auto"
  tal:attributes="src python:request.object_request()+'__aon.dot.png'"/>
</object>

<hr/>
</div>

</tal:block>
